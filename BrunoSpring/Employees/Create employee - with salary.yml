info:
  name: Create employee - with salary
  type: http
  seq: 20

http:
  method: POST
  url: "{{domain}}/employees"
  body:
    type: json
    data: |-
      {
        "firstName": "Margaret",
        "lastName": "Hamilton",
        "salary": 120000
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
