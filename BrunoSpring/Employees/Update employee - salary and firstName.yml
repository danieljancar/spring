info:
  name: Update employee - salary and firstName
  type: http
  seq: 16

http:
  method: PUT
  url: "{{domain}}/employees/1"
  body:
    type: json
    data: |-
      {
        "firstName": "Katherine",
        "salary": 95000
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
