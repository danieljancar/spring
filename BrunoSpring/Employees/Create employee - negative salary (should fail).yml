info:
  name: Create employee - negative salary (should fail)
  type: http
  seq: 22

http:
  method: POST
  url: "{{domain}}/employees"
  body:
    type: json
    data: |-
      {
        "firstName": "Test",
        "lastName": "User",
        "salary": -10000
      }
