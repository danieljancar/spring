info:
  name: Create employee with address
  type: http
  seq: 5

http:
  method: POST
  url: "{{domain}}/employees"
  body:
    type: json
    data: |-
      {
        "firstName": "Alice",
        "lastName": "Johnson",
        "address": {
          "street": "123 Main Street",
          "city": "Springfield"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
