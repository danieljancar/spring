info:
  name: Update employee add address
  type: http
  seq: 6

http:
  method: PUT
  url: "{{domain}}/employees/2"
  body:
    type: json
    data: |-
      {
        "address": {
          "street": "456 Oak Avenue",
          "city": "Portland"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
